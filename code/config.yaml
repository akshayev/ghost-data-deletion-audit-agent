# Ghost Data Still Exists - run configuration.
# Precedence: CLI flags > environment variables > this file > built-in defaults.
# Paths are relative to the repository root. Never put API keys here: they are read from the
# environment (GEMINI_API_KEY, GROQ_API_KEY), e.g. via an uncommitted .env file.

dataset: dataset                 # env GHOST_DATASET, CLI --dataset
output: output.csv               # full-split submission file (CLI --out)
runs_dir: code/evaluation/runs   # traces, run_summary.json, reports (gitignored)
cache_dir: code/cache            # LLM + vision caches and the usage ledger (committed)
trace: true                      # env GHOST_TRACE=0 turns per-case traces off
mode: auto                       # auto: agent mode replayed offline from code/cache (no network,
                                 #   no keys needed; the default and the submission command)
                                 # agent: live case agent (new model calls when keys are set)
                                 # deterministic: no case agent. env GHOST_MODE, CLI --mode

agent:                           # LLM case investigator (routed cases only)
  max_tool_calls: 8              # then FALLBACK_TOOL_CAP (deterministic plan kept)
  max_rejections: 2              # rejected proposals allowed; one more -> FALLBACK_REJECTED
  max_agent_cases: null          # budget (CLI --max-agent-cases); the rest -> FALLBACK_BUDGET
  checkpoint_dir: code/cache/agent_runs   # <config_hash>/<case_id>.json: reruns are free
  accepted_models:               # only these models' decisions are used (sample gate:
    - openai/gpt-oss-120b        #   python code/evaluation/model_gate.py --table)
  rate_limits:                   # client-side limits per (provider, model), 60 s window
    groq: {rpm: 25, tpm: 7000}
    gemini: {rpm: 10, tpm: 250000}

llm:
  providers: [gemini, groq]      # classifier/vision order; groq is text-only
  # case agent chain: groq GROQ_MODEL -> groq GROQ_FALLBACK_MODEL -> gemini GEMINI_MODEL
  gemini_model: gemini-3.8-flash # env GEMINI_MODEL
  gemini_text_model: null        # env GEMINI_TEXT_MODEL (classifier); null = gemini_model
  groq_model: null               # env GROQ_MODEL

linker:
  tiebreak: SKIP_MULTI           # env GHOST_TIEBREAK: ORDER | SKIP_ALL | SKIP_MULTI | REQUESTED
  learn_range_hours: 6.0         # worker events farther than this from reported_at never teach a window
  window_pad_hours: 0.1          # padding around each learned window
  default_window: [-1.5, 2.5]    # window for templates with no learned samples

# Price list used by evaluation/usage_report.py (USD per 1M tokens). Free-tier calls cost $0 in
# reality; the report also shows what the same tokens would cost at these list prices.
pricing:
  source: provider list prices, retrieved 2026-10-25
  date: "2026-10-25"
  models:
    "groq:openai/gpt-oss-120b": {input: 0.15, output: 0.60}
    "groq:openai/gpt-oss-20b": {input: 0.07, output: 0.30}
    "gemini:gemini-3.8-flash": {input: 0.75, output: 3.75}
    "gemini:gemini-3.5-flash": {input: 1.50, output: 9.00}
